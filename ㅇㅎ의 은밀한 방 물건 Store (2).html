<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>ㅇㅎ의 은밀한 방 물건 Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#fff;--card:#f3f3f1;--ink:#111;--mut:#6d6d68;--line:#e2e2de;--red:#ff3b2f;--or:#ff8a00;
--h:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--b:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0e0e0e;--card:#1b1b1a;--ink:#f4f4f0;--mut:#9a9a94;--line:#2c2c2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--b)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 20px}
.logo{font-family:var(--h);font-size:20px;line-height:1.1}
.logo i{font-style:normal;background:var(--or);color:#111;border-radius:6px;padding:1px 7px;margin-left:6px;font-size:14px}
.logo span{cursor:pointer;user-select:none}
.modes{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-left:auto}
.mode{border:0;background:none;padding:5px 16px;cursor:pointer;font-weight:800}
.mode.on{background:var(--ink);color:var(--bg)}
.nav{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.nav a,.nav button{background:none;border:0;cursor:pointer;padding:6px 9px;border-radius:8px;font-weight:600}
.nav a:hover,.nav button:hover{background:var(--card)}
main{max-width:1040px;margin:0 auto;padding:20px}
.hero{position:relative;overflow:hidden;padding:44px 0 36px;margin-bottom:8px}
.hero h1{font-family:var(--h);font-weight:400;font-size:clamp(44px,11vw,112px);line-height:1;letter-spacing:-.02em;margin:0 0 16px;position:relative;z-index:1}
.hero p{margin:0;font-size:17px;color:var(--mut);max-width:34ch;position:relative;z-index:1}
.kh{position:absolute;right:-30px;top:10px;width:min(34vw,260px);aspect-ratio:1/1.5}
.kh::before{content:"";position:absolute;left:0;right:0;top:0;aspect-ratio:1;border-radius:50%;background:var(--or)}
.kh::after{content:"";position:absolute;left:34%;right:34%;top:46%;bottom:0;background:var(--or);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.kh i{position:absolute;left:50%;top:25%;width:26%;aspect-ratio:1;border-radius:50%;background:var(--bg);transform:translateX(-50%);z-index:2}
.kh b{position:absolute;left:44%;right:44%;top:40%;height:34%;background:var(--bg);z-index:2;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
input,select,textarea{background:var(--card);border:2px solid transparent;border-radius:12px;padding:10px 14px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 22px}
.chip{border:2px solid var(--line);background:none;border-radius:999px;padding:3px 14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px 16px}
.th{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:72px;position:relative;background:var(--card)}
.card:hover .th{outline:3px solid var(--ink)}
.th img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.tn{width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid var(--line)}
.row>input{flex:1;min-width:0}
.sold{position:absolute;inset:0;border-radius:18px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-weight:800}
.cb{padding:8px 2px}
.cb h3{margin:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb b{font-family:var(--h);font-size:20px;font-weight:400}
.cb small{display:block;color:var(--mut)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:11px 20px;font-weight:800;cursor:pointer}
.btn.r{background:var(--red);color:#fff}.btn.gh{background:none;color:var(--ink);border:2px solid var(--line)}.btn.sm{padding:3px 11px;font-size:13px;border-radius:8px}.btn.red{background:#d62b20;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sb{display:flex;align-items:center;gap:12px;width:100%;background:none;border:2px solid var(--ink);border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;text-align:left}
.sb:hover{background:var(--card)}
.sb s{text-decoration:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800}
.panel{background:var(--card);border-radius:20px;padding:22px;margin-bottom:16px}
.panel h2{font-family:var(--h);font-weight:400;margin:0 0 12px;font-size:26px}
.panel input,.panel select,.panel textarea{background:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f{display:grid;gap:10px;max-width:440px}
label{font-weight:800;font-size:13px;color:var(--mut)}
.det{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.det .th{font-size:140px;border-radius:24px}
.price{font-family:var(--h);font-size:34px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border-radius:16px;padding:16px}
.stat b{font-family:var(--h);font-size:30px;font-weight:400;display:block}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.tag{display:inline-block;padding:0 9px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800}
.tag.x{background:var(--red);color:#fff}.tag.off{background:var(--line);color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:56px 10px}
.empty h2{font-family:var(--h);font-weight:400;font-size:28px;color:var(--ink);margin:0 0 6px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#bc{height:320px;overflow:auto;background:var(--bg);border-radius:14px;padding:8px 12px;margin-bottom:10px}
#cc{height:340px;overflow:auto;background:var(--bg);border-radius:14px;padding:8px 12px;margin-bottom:10px}
.bub{max-width:82%;padding:8px 13px;border-radius:16px;margin:6px 0;background:var(--card)}
.bub.u{margin-left:auto;background:var(--ink);color:var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
dialog{border:0;border-radius:20px;padding:22px;max-width:420px;width:92%;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
@media (max-width:640px){.det{grid-template-columns:1fr}.modes{margin-left:0}.kh{opacity:.18}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sb .lg{display:grid;place-items:center;width:26px;height:26px}.sb .lg svg{width:20px;height:20px}
.bub{white-space:pre-wrap;overflow-wrap:anywhere}
.ft{margin-top:90px;border-top:1px solid var(--line);background:var(--card);padding:32px 20px calc(36px + env(safe-area-inset-bottom,0px))}
.ft-in{max-width:1100px;margin:0 auto}.ft-top{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between;align-items:center}
.ft-brand{font-family:var(--h);font-weight:400;font-size:20px}.ft-brand i{font-style:normal;color:var(--mut);font-size:14px;margin-left:6px}
.ft-nav{display:flex;flex-wrap:wrap;gap:6px 18px}.ft-nav button{background:none;border:0;padding:4px 0;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}.ft-nav button:hover{color:var(--ink);text-decoration:underline}
.ft-badges{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.ft-badges span{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--mut)}.ft-copy{margin:0;font-size:12px;color:var(--mut)}
</style>
</head>

var IQC=['주문·배송','결제·환불','중고거래','계정','기타'];
var db=null,q='',cat='전체',reg='전체',atab='dash',authMode='login',stab='bot',photos=[],sPhone=null,co=null;
try{var r=localStorage.getItem('oh_db_v3');if(r)db=JSON.parse(r)}catch(e){}

db.inq=db.inq||[];db.reviews=db.reviews||[];db.mails=db.mails||[];db.rooms=db.rooms||[];db.theme=db.theme||'light';db.logs=db.logs||[];

 if(db.session&&ADM.indexOf(db.session)<0)db.session=null;db.logs=[];db.purge1=1;

function newSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
async function hp(pw,salt){var e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:e.encode(salt),iterations:150000,hash:'SHA-256'},k,256);return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
